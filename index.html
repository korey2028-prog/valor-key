<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A tiny dictionary for Valentina's Day, made quietly for V."
    />
    <meta name="theme-color" content="#fffaf2" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23fffaf2'/%3E%3Cpath d='M32 50c-8-7-16-12-16-21 0-6 4-10 10-10 3 0 5 1 6 4 1-3 4-4 6-4 6 0 10 4 10 10 0 9-8 14-16 21z' fill='%230ABAB5'/%3E%3C/svg%3E"
    />
    <title>To my angel.</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="mystery-layer" aria-hidden="true">
      <span class="apocalypse-orb"><i></i></span>
      <span class="violet-rift"><i></i></span>
      <span class="ruin-line ruin-line--left"></span>
      <span class="ruin-line ruin-line--right"></span>
      <span class="floating-stone floating-stone--one"></span>
      <span class="floating-stone floating-stone--two"></span>
      <span class="floating-stone floating-stone--three"></span>
      <span class="floating-stone floating-stone--four"></span>
      <span class="glow-flora glow-flora--left"></span>
      <span class="glow-flora glow-flora--right"></span>
      <span class="pine-field pine-field--left"></span>
      <span class="pine-field pine-field--right"></span>
      <span class="star-map star-map--one">
        <i></i>
        <i></i>
        <i></i>
        <i></i>
        <i></i>
      </span>
      <span class="star-map star-map--two">
        <i></i>
        <i></i>
        <i></i>
        <i></i>
      </span>
      <span class="journal-mark journal-mark--one">
        <b>05.21</b>
        <small>V / K</small>
      </span>
      <span class="journal-mark journal-mark--two">
        <b>home</b>
        <small>entry 01</small>
      </span>
      <span class="cipher-strip cipher-strip--one">
        V K / A N G Y A L O M / 0521 / HOME
      </span>
      <span class="cipher-strip cipher-strip--two">
        THINKING OF YOU / TIANJIN / LITTLE LANGUAGE
      </span>
    </div>

    <main class="site-shell">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">May 21</p>
          <h1 class="hero-title" id="hero-title" aria-live="polite">
            <span class="hero-line hero-line-one">To my angel,</span>
            <span class="hero-line hero-line-two">Happy Valentina's Day.</span>
          </h1>
          <p class="hero-note">
            A small dictionary for the way a little home started to have its
            own language.
          </p>
        </div>
      </section>

      <section class="dictionary" aria-labelledby="dictionary-title">
        <div class="section-heading">
          <p class="eyebrow">Our little words</p>
          <h2 id="dictionary-title">A language that found us gently.</h2>
        </div>

        <div class="word-grid" id="word-grid">
          <button
            class="word-card"
            type="button"
            aria-expanded="false"
            data-word="so comfortable"
          >
            <span class="word-card__tag">feeling</span>
            <span class="word-card__term">so comfortable</span>
            <span class="word-card__hint">the sentence that stayed warm</span>
            <span class="word-card__story">
              You said it so simply, and somehow it became a whole room. Not a
              big declaration. Just the quiet proof that being close did not
              need to feel difficult.
            </span>
          </button>

          <button
            class="word-card"
            type="button"
            aria-expanded="false"
            data-word="hangout"
          >
            <span class="word-card__tag">permission</span>
            <span class="word-card__term">hangout</span>
            <span class="word-card__hint">a soft name for showing up</span>
            <span class="word-card__story">
              I like that this word gave us a place to stand without making the
              place smaller. It kept things light, and still somehow made them
              more real.
            </span>
          </button>

          <button
            class="word-card"
            type="button"
            aria-expanded="false"
            data-word="angel"
          >
            <span class="word-card__tag">name</span>
            <span class="word-card__term">angel</span>
            <span class="word-card__hint">not grand, just tender</span>
            <span class="word-card__story">
              Some names are not meant to impress anyone outside the room. This
              one is small enough to say softly, and warm enough to keep.
            </span>
          </button>

          <button
            class="word-card"
            type="button"
            aria-expanded="false"
            data-word="we"
          >
            <span class="word-card__tag">home</span>
            <span class="word-card__term">we</span>
            <span class="word-card__hint">the smallest house a sentence can make</span>
            <span class="word-card__story">
              A tiny word, but it changes the furniture of a day. It makes room
              for two people, two cats, and the strange calm of belonging for a
              while.
            </span>
          </button>

          <button
            class="word-card"
            type="button"
            aria-expanded="false"
            data-word="I miss you so much"
          >
            <span class="word-card__tag">distance</span>
            <span class="word-card__term">I miss you so much</span>
            <span class="word-card__hint">honest, because it had somewhere to go</span>
            <span class="word-card__story">
              I said it because hiding it would have felt less true. You made it
              safe by answering with something practical and kind: then call me.
            </span>
          </button>

          <button
            class="word-card"
            type="button"
            aria-expanded="false"
            data-word="natural"
          >
            <span class="word-card__tag">rhythm</span>
            <span class="word-card__term">natural</span>
            <span class="word-card__hint">when nothing needs to be forced</span>
            <span class="word-card__story">
              Some connections spend too much energy explaining themselves.
              This one often feels like it arrived already knowing how to sit
              beside us.
            </span>
          </button>

          <button
            class="word-card word-card--egg"
            type="button"
            aria-expanded="false"
            data-word="angyalom"
          >
            <span class="word-card__tag">hungarian egg</span>
            <span class="word-card__term">angyalom</span>
            <span class="word-card__hint">my angel</span>
            <span class="word-card__story">
              I am still learning how your language holds tenderness. This is
              one small key I wanted to keep in my pocket.
            </span>
          </button>

          <button
            class="word-card word-card--egg"
            type="button"
            aria-expanded="false"
            data-word="Gondolok rád"
          >
            <span class="word-card__tag">hungarian egg</span>
            <span class="word-card__term">Gondolok rád</span>
            <span class="word-card__hint">I am thinking of you</span>
            <span class="word-card__story">
              Not as a dramatic thing. More like a light left on in the corner
              of the day, quietly saying: you are here with me.
            </span>
          </button>
        </div>
      </section>

      <footer class="site-footer" aria-label="signature">
        <span>for V, from K.</span>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
